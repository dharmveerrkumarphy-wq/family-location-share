<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Location</title><style>
body{font-family:Arial;margin:0;background:#08111f;color:#fff;padding:20px}.card{max-width:430px;margin:30px auto;padding:24px;border-radius:24px;background:#142338;box-shadow:0 20px 60px #0008}input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:0;font-size:16px}button{background:#38bdf8;font-weight:bold}#map{width:100%;height:280px;border:0;border-radius:16px;margin-top:15px}
</style></head><body><div class="card"><h1>📍 Family Location</h1>
<p>Enter a family member's number. They must explicitly allow location sharing.</p>
<input id="phone" placeholder="+91XXXXXXXXXX" inputmode="tel"><button onclick="send()">Send Request</button>
<p id="s"></p><div id="loc"></div></div>
<script>
let id=null,timer=null;
async function send(){const phone=document.getElementById("phone").value.trim();s.textContent="Sending…";
 const r=await fetch("/api/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone})});
 const j=await r.json(); if(!r.ok){s.textContent=j.error;return}
 id=j.id;s.textContent="Request sent. Waiting for Allow…"; timer=setInterval(poll,3000)}
async function poll(){const r=await fetch("/api/request/"+id);const j=await r.json();
 if(j.status==="sharing"&&j.location){const x=j.location;loc.innerHTML=`<b>Sharing location</b><br>Lat: ${x.lat.toFixed(6)}<br>Lon: ${x.lon.toFixed(6)}<br>Accuracy: ${Math.round(x.accuracy||0)} m<br><a target="_blank" href="https://www.google.com/maps?q=${x.lat},${x.lon}">Open in Google Maps</a>`}
 else if(j.status==="stopped"){clearInterval(timer);s.textContent="Location sharing stopped.";loc.innerHTML=""}}
</script></body></html>
